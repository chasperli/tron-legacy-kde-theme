<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect id="center" x="4" y="30" width="492" height="166" fill="#06090E" fill-opacity="0.5"/>
  <rect id="top" x="4" y="0" width="492" height="30" fill="#0A141E" fill-opacity="0.88"/>
  <rect id="left" x="0" y="30" width="4" height="166" fill="#06090E" fill-opacity="0.5"/>
  <rect id="right" x="496" y="30" width="4" height="166" fill="#06090E" fill-opacity="0.5"/>
  <rect id="bottom" x="4" y="196" width="492" height="4" fill="#06090E" fill-opacity="0.5"/>
  <rect id="topleft" x="0" y="0" width="4" height="30" fill="#0A141E" fill-opacity="0.88"/>
  <rect id="topright" x="496" y="0" width="4" height="30" fill="#0A141E" fill-opacity="0.88"/>
  <rect id="bottomleft" x="0" y="196" width="4" height="4" fill="#06090E" fill-opacity="0.5"/>
  <rect id="bottomright" x="496" y="196" width="4" height="4" fill="#06090E" fill-opacity="0.5"/>
  <line x1="0" y1="30" x2="500" y2="30" stroke="#00F5FF" stroke-width="1.5" opacity="0.7" filter="url(#glow-soft)"/>
  <line x1="4" y1="0" x2="496" y2="0" stroke="#00F5FF" stroke-width="1.5" opacity="0.85" filter="url(#glow)"/>
  <line x1="0" y1="0" x2="0" y2="200" stroke="#00F5FF" stroke-width="1" opacity="0.6" filter="url(#glow-soft)"/>
  <line x1="500" y1="0" x2="500" y2="200" stroke="#00F5FF" stroke-width="1" opacity="0.6" filter="url(#glow-soft)"/>
  <polyline points="0,12 0,0 12,0" fill="none" stroke="#00F5FF" stroke-width="2.5" opacity="0.95" filter="url(#glow2)"/>
  <polyline points="488,0 500,0 500,12" fill="none" stroke="#00F5FF" stroke-width="2.5" opacity="0.95" filter="url(#glow2)"/>
  <rect id="decoration-inactive-center" x="4" y="30" width="492" height="166" fill="#06090E" fill-opacity="0.0"/>
  <rect id="decoration-inactive-top" x="4" y="0" width="492" height="30" fill="#06090E" fill-opacity="0.7"/>
  <rect id="decoration-maximized" x="0" y="0" width="500" height="30" fill="#0A141E" fill-opacity="0.92"/>
  <line x1="0" y1="30" x2="500" y2="30" stroke="#00F5FF" stroke-width="1.5" opacity="0.75" filter="url(#glow-soft)"/>
  <rect id="mask" x="4" y="30" width="492" height="166" fill="white"/>
</svg>
