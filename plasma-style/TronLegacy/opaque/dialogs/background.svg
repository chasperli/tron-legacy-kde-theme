<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect id="center" x="10" y="10" width="180" height="180" fill="#080E14" fill-opacity="1.0"/>
  <rect id="top" x="10" y="0" width="180" height="10" fill="#080E14" fill-opacity="1.0"/>
  <rect id="bottom" x="10" y="190" width="180" height="10" fill="#080E14" fill-opacity="1.0"/>
  <rect id="left" x="0" y="10" width="10" height="180" fill="#080E14" fill-opacity="1.0"/>
  <rect id="right" x="190" y="10" width="10" height="180" fill="#080E14" fill-opacity="1.0"/>
  <rect id="topleft" x="0" y="0" width="10" height="10" fill="#080E14" fill-opacity="1.0"/>
  <rect id="topright" x="190" y="0" width="10" height="10" fill="#080E14" fill-opacity="1.0"/>
  <rect id="bottomleft" x="0" y="190" width="10" height="10" fill="#080E14" fill-opacity="1.0"/>
  <rect id="bottomright" x="190" y="190" width="10" height="10" fill="#080E14" fill-opacity="1.0"/>
  <line x1="10" y1="1" x2="190" y2="1" stroke="#00F5FF" stroke-width="1.5" opacity="0.85" filter="url(#glow)"/>
  <line x1="10" y1="199" x2="190" y2="199" stroke="#00F5FF" stroke-width="1.5" opacity="0.85" filter="url(#glow)"/>
  <line x1="1" y1="10" x2="1" y2="190" stroke="#00F5FF" stroke-width="1.5" opacity="0.85" filter="url(#glow)"/>
  <line x1="199" y1="10" x2="199" y2="190" stroke="#00F5FF" stroke-width="1.5" opacity="0.85" filter="url(#glow)"/>
  <circle cx="2" cy="2" r="2" fill="#00F5FF" opacity="0.9" filter="url(#glow)"/>
  <circle cx="198" cy="2" r="2" fill="#00F5FF" opacity="0.9" filter="url(#glow)"/>
  <circle cx="2" cy="198" r="2" fill="#00F5FF" opacity="0.9" filter="url(#glow)"/>
  <circle cx="198" cy="198" r="2" fill="#00F5FF" opacity="0.9" filter="url(#glow)"/>
  <rect id="hint-stretch-borders" x="10" y="10" width="180" height="180" fill="none" stroke="none"/>
</svg>
