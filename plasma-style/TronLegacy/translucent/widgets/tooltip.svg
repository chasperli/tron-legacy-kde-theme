  <line x1="6" y1="1" x2="194" y2="1" stroke="#00F5FF" stroke-width="1.5" opacity="0.85" filter="url(#glow)"/>
  <line x1="6" y1="199" x2="194" y2="199" stroke="#00F5FF" stroke-width="1.5" opacity="0.85" filter="url(#glow)"/>
